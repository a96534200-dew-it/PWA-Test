<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Notes</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80' fill='%238aab55'>🅐</text></svg>">
	<link rel="stylesheet" href="styles.css">
	<link rel="manifest" href="manifest.json">
</head>

<body class="wrap">
	<div class="top-bar">
		<div id="save-dot" title="loading"></div>
		<div class="spacer"></div>
		<span class="counter-block">
			<span class="counter">1</span>
		</span>
		<input id="file-name" placeholder="My Note.md">
		<input type="button" class="bar-button" value="Export">
		<!-- <input type="button" class="bar-button" value="Import"> -->
		<button id="modeBtn" type="button" aria-pressed="true" title="toggle markdown live view"><b>M</b>d</button>
	</div>
	<textarea id="plaintext" placeholder="type here"></textarea>
	<div id="mdText"></div>
	<script defer src="vendors/marked.min.js"></script>
	<script defer src="main.js"></script>
</body>
